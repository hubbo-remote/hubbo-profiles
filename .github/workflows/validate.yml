# Validate pull requests and the main branch. Everything runs in the repository's Docker tools
# image, exactly as locally (tools/bin/validate).
name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request needs history back to its base, for the revision rule; a push needs none.
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}
      - name: Validate the changes (the whole tree when schemas or tools change), and the revision rule
        if: github.event_name == 'pull_request'
        run: tools/bin/validate --since "origin/${{ github.base_ref }}"
      - name: Validate the whole tree
        if: github.event_name == 'push'
        run: tools/bin/validate
