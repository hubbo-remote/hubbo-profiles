# Validate pull requests and the main branch. Everything runs in the repository's Docker tools
# image, exactly as locally (tools/bin/validate).
name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # --since compares with an earlier commit (the revision rule needs it)
      - name: Validate the changes (the whole tree when schemas or tools change), and the revision rule
        if: github.event_name == 'pull_request'
        run: tools/bin/validate --since "origin/${{ github.base_ref }}"
      - name: Validate the push's changes (everything when schemas or tools change, or on a first or force push)
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            tools/bin/validate --since "$BEFORE"
          else
            tools/bin/validate
          fi
